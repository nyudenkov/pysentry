# Example: audit Python dependencies with PySentry on every push and PR.
#
# On push to the default branch, results are uploaded to GitHub Code Scanning
# (Security tab). On pull requests the upload is skipped automatically — fork PRs
# can't get the write token, so results appear in the run's job summary instead
# (PySentry writes a compact report there whenever it runs in Actions).
#
# Copy this file to .github/workflows/pysentry.yml in your repository.

name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Required for the SARIF upload to Code Scanning (used on push, not on PRs)
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PySentry audit
        uses: nyudenkov/pysentry@v0.5.0
        with:
          # All inputs are optional; these are the common ones:
          fail-on: high            # fail the job on high/critical findings
          # sources: osv           # limit vulnerability sources
          # ignore: GHSA-xxxx-yyyy # space-separated IDs to suppress
          # upload-sarif: 'false'  # disable the Code Scanning upload entirely
          # upload-sarif-on-pr: 'true' # also upload on same-repo PRs (off by default)
