# Dogfood: audit the benchmarks/ Python environment with our own GitHub Action.
# Doubles as a live showcase that nyudenkov/pysentry works as advertised.

name: Audit Benchmarks Env

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "benchmarks/uv.lock"
      - "benchmarks/pyproject.toml"
      - ".github/workflows/audit-benchmarks.yml"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PySentry audit (benchmarks env)
        uses: nyudenkov/pysentry@v0.4.9
        with:
          path: benchmarks
          fail-on: high
          category: pysentry-benchmarks
